<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Chroma Drop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; overflow: hidden; background: #f7c9d8; font-family: "Baloo 2", "Segoe UI", system-ui, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
        #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
        #view:active { cursor: grabbing; }
        .hidden { display: none !important; }
        .shadow { text-shadow: 0 3px 0 rgba(0, 0, 0, 0.12), 0 6px 18px rgba(60, 20, 60, 0.25); }

        /* title */
        #title { position: fixed; inset: 0; display: grid; place-items: center; cursor: pointer; }
        .card { text-align: center; }
        .logo { margin: 0; font-weight: 800; font-size: clamp(64px, 13vw, 140px); line-height: 0.85; letter-spacing: -0.02em;
            background: linear-gradient(180deg, #fff, #ffe3f0 50%, #ffd1e6); -webkit-background-clip: text; background-clip: text; color: transparent;
            filter: drop-shadow(0 5px 0 rgba(255, 90, 150, 0.55)) drop-shadow(0 14px 22px rgba(90, 30, 90, 0.3)); }
        .logo span { display: block; }
        .tag { font-size: 22px; font-weight: 700; margin: 14px 0 26px; }
        .tap { display: inline-block; padding: 12px 40px; border-radius: 40px; background: #fff; color: #ff4f8a; font-size: 24px; font-weight: 800; box-shadow: 0 6px 0 rgba(255, 79, 138, 0.45), 0 14px 30px rgba(90, 30, 90, 0.25); animation: pulse 1.3s ease-in-out infinite; }
        @keyframes pulse { 50% { transform: scale(1.07); } }
        .meta { margin-top: 20px; font-size: 18px; font-weight: 700; }
        .meta b { background: rgba(255, 255, 255, 0.3); border-radius: 10px; padding: 0 10px; margin: 0 4px; }
        .how { margin-top: 10px; font-size: 16px; opacity: 0.92; }

        /* hud */
        #hud { position: fixed; inset: 0; pointer-events: none; }
        #progress { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; }
        .lv { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; font-weight: 800; background: rgba(255, 255, 255, 0.35); box-shadow: 0 4px 12px rgba(60, 20, 60, 0.18); }
        #lvB { background: #fff; color: #bbb; }
        .bar { width: min(320px, 52vw); height: 16px; border-radius: 10px; background: rgba(255, 255, 255, 0.45); overflow: hidden; box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.08); }
        #fill { height: 100%; width: 0; border-radius: 10px; transition: width 0.25s ease-out; }
        #score { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); font-size: 64px; font-weight: 800; line-height: 1; }
        #best { position: absolute; top: 18px; right: 20px; font-weight: 800; font-size: 18px; }

        #popups { position: fixed; inset: 0; pointer-events: none; }
        .pop { position: absolute; transform: translate(-50%, -50%); font-weight: 800; font-size: 30px; white-space: nowrap; animation: rise 0.9s ease-out forwards; text-shadow: 0 3px 0 rgba(0, 0, 0, 0.12); }
        .pop.big { font-size: 38px; }
        .pop.fire { font-size: 44px; color: #ffe066; text-shadow: 0 0 16px #ff7a1a, 0 3px 0 #d9480f; }
        @keyframes rise { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.5); } 20% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -170%) scale(1); } }

        #banner { position: fixed; top: 30%; left: 0; right: 0; text-align: center; font-size: clamp(34px, 7vw, 64px); font-weight: 800; opacity: 0; pointer-events: none; }
        #banner.show { animation: banner 1.8s ease-out forwards; }
        @keyframes banner { 0% { opacity: 0; transform: scale(0.6); } 15% { opacity: 1; transform: scale(1.1); } 25% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px); } }

        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(60, 20, 60, 0.6); padding: 6px 16px; border-radius: 14px; opacity: 0; transition: opacity 0.2s; }
        #toast.show { opacity: 1; }

        /* game over */
        #over { position: fixed; inset: 0; display: grid; place-items: center; cursor: pointer; background: rgba(60, 20, 70, 0.28); }
        #over h2 { margin: 0; font-size: clamp(40px, 8vw, 72px); font-weight: 800; }
        #o-score { font-size: clamp(80px, 16vw, 150px); font-weight: 800; line-height: 1; }
        #o-best, #o-level { font-size: 22px; font-weight: 700; }
        #over .tap { margin-top: 24px; }
    </style>
</head>

<body>
    <canvas id="view"></canvas>
    <div id="popups"></div>
    <div id="banner" class="shadow"></div>
    <div id="toast"></div>

    <div id="title">
        <div class="card">
            <h1 class="logo"><span>CHROMA</span><span>DROP</span></h1>
            <div class="tag shadow">Spin the tower. Drop through the gaps. Don't touch red.</div>
            <div class="tap">TAP TO PLAY</div>
            <div class="meta shadow">Level <b id="t-level">1</b> Best <b id="t-best">0</b></div>
            <div class="how shadow">Drag or ← → to spin · fall through 3 rings in a row to catch fire · M sound</div>
        </div>
    </div>

    <div id="hud" class="hidden">
        <div id="progress"><div class="lv shadow" id="lvA">1</div><div class="bar"><div id="fill"></div></div><div class="lv" id="lvB">2</div></div>
        <div id="score" class="shadow">0</div>
        <div id="best" class="shadow">BEST <span id="bestv">0</span></div>
    </div>

    <div id="over" class="hidden">
        <div class="card">
            <h2 class="shadow">Oops!</h2>
            <div id="o-score" class="shadow">0</div>
            <div id="o-best" class="shadow"></div>
            <div id="o-level" class="shadow"></div>
            <div class="tap">TAP TO RETRY</div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
